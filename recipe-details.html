<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="recipe_details_title">تفاصيل الوصفة</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(140deg, #C8B6FF, #B9FBC0);
    margin: 0; padding: 0;
    min-height: 100vh;
    color: #333;
    overflow-x: hidden;
  }

  .container {
    max-width: 700px;
    background: rgba(255,255,255,0.95);
    border-radius: 22px;
    box-shadow: 0 0 25px rgba(0,0,0,0.15);
    margin: 80px auto 40px;
    padding: 30px 25px;
  }

  h1 {
    font-weight: 700;
    font-size: 2rem;
    margin-bottom: 20px;
    text-align: center;
    color: #5a3ea0;
  }

  h2 {
    font-weight: 600;
    font-size: 1.5rem;
    margin-top: 30px;
    margin-bottom: 15px;
    border-bottom: 2px solid #8A7FFF;
    padding-bottom: 6px;
  }

  ul.ingredients-list {
    list-style: disc inside;
    font-size: 1.1rem;
    color: #444;
  }

  ol.steps-list {
    font-size: 1.1rem;
    color: #444;
    padding-left: 20px;
  }

  .calories-info {
    margin-top: 25px;
    font-size: 1.2rem;
    font-weight: 600;
    color: #6A5CF7;
    text-align: center;
  }

  .btn-back {
    display: inline-block;
    margin-top: 40px;
    background-color: #8A7FFF;
    color: white;
    padding: 12px 28px;
    border-radius: 22px;
    font-size: 1.1rem;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
    transition: background-color 0.3s;
  }

  .btn-back:hover {
    background-color: #6A5CF7;
  }

  /* زر القائمة */
  .sidebar-toggle {
    position: fixed;
    top: 16px;
    left: 16px;
    background-color: #8A7FFF;
    border: none;
    color: white;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    z-index: 1001;
  }

  .sidebar-toggle:hover {
    background-color: #6A5CF7;
  }

  /* القائمة الجانبية */
  .sidebar {
    height: 100%;
    width: 0;
    position: fixed;
    z-index: 1000;
    top: 0;
    left: 0;
    background-color: #7F67FF;
    overflow-x: hidden;
    transition: 0.3s;
    padding-top: 60px;
  }

  .sidebar a {
    padding: 15px 30px;
    text-decoration: none;
    font-size: 18px;
    color: white;
    display: block;
    transition: 0.2s;
  }

  .sidebar a:hover {
    background-color: #6A5CF7;
  }

  .sidebar .close-btn {
    position: absolute;
    top: 10px;
    right: 18px;
    font-size: 28px;
    color: white;
    cursor: pointer;
  }

  /* زر الترجمة */
  .lang-switcher {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 1002;
  }

  .lang-switcher button {
    background-color: #8A7FFF;
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    margin-left: 8px;
  }

  .lang-switcher button:hover {
    background-color: #6A5CF7;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .container {
      margin: 60px 12px 30px;
      padding: 20px 15px;
    }
    h1 {
      font-size: 1.6rem;
    }
    h2 {
      font-size: 1.3rem;
    }
    ul.ingredients-list, ol.steps-list {
      font-size: 1rem;
    }
  }
</style>
</head>
<body>

<!-- زر القائمة -->
<button class="sidebar-toggle" aria-label="فتح القائمة">&#9776;</button>

<!-- القائمة الجانبية -->
<div class="sidebar" id="sidebar" aria-label="القائمة الجانبية">
  <a href="javascript:void(0)" class="close-btn" aria-label="إغلاق القائمة">&times;</a>

  <a href="splash.html" data-i18n="menu_splash">الشاشة الرئيسية</a>
  <a href="login.html" data-i18n="menu_login">تسجيل الدخول</a>
  <a href="register.html" data-i18n="menu_register">التسجيل</a>
  <a href="about.html" data-i18n="menu_about">حول التطبيق</a>
  <a href="home.html" data-i18n="menu_home">الرئيسية</a>
  <a href="profile.html" data-i18n="menu_profile">الملف الشخصي</a>
  <a href="categories.html" data-i18n="menu_categories">التصنيفات</a>
  <a href="all-recipes.html" data-i18n="menu_all_recipes">جميع الوصفات</a>
  <a href="calorie-tracker.html" data-i18n="menu_calories">تتبع السعرات الحرارية</a>
  <a href="add-ingredient.html" data-i18n="menu_add_ingredient">إضافة مكون</a>
  <a href="category-recipes.html" data-i18n="menu_category_recipes">وصفات التصنيف</a>
  <a href="recipe-details.html" data-i18n="menu_recipe_details">تفاصيل الوصفة</a>
  <a href="search.html" data-i18n="menu_search">بحث</a>
  <a href="shopping-list.html" data-i18n="menu_shopping_list">قائمة التسوق</a>
  <a href="health-goals.html" data-i18n="menu_health_goals">الأهداف الصحية</a>
  <a href="settings.html" data-i18n="menu_settings">الإعدادات</a>
</div>

<!-- زر الترجمة -->
<div class="lang-switcher" id="lang-switcher" role="navigation" aria-label="تبديل اللغة">
  <button id="lang-ar" aria-pressed="true">العربية</button>
  <button id="lang-en" aria-pressed="false">English</button>
</div>

<div class="container" role="main" tabindex="0">
  <h1 id="recipe-title">تفاصيل الوصفة</h1>

  <h2 data-i18n="ingredients_title">المكونات</h2>
  <ul class="ingredients-list" id="ingredients-list"></ul>

  <h2 data-i18n="steps_title">طريقة التحضير</h2>
  <ol class="steps-list" id="steps-list"></ol>

  <p class="calories-info" id="calories-info"></p>

  <a href="category-recipes.html" class="btn-back" data-i18n="btn_back">رجوع</a>
</div>

<script>
  // القائمة الجانبية
  const sidebar = document.getElementById('sidebar');
  const openBtn = document.querySelector('.sidebar-toggle');
  const closeBtn = sidebar.querySelector('.close-btn');

  openBtn.addEventListener('click', () => {
    sidebar.style.width = '250px';
  });

  closeBtn.addEventListener('click', () => {
    sidebar.style.width = '0';
  });

  window.addEventListener('click', (e) => {
    if (!sidebar.contains(e.target) && e.target !== openBtn) {
      sidebar.style.width = '0';
    }
  });

  // بيانات الوصفات (ممكن تحطها ديناميكياً لو عندك backend)
  const recipes = {
    breakfast1: {
      title: { ar: "العجة بالخضار", en: "Vegetable Omelette" },
      ingredients: [
        { ar: "3 بيضات", en: "3 eggs" },
        { ar: "نصف كوب خضار مشكلة مفرومة", en: "Half cup mixed chopped vegetables" },
        { ar: "ملح وفلفل حسب الرغبة", en: "Salt and pepper to taste" },
        { ar: "ملعقة زيت زيتون", en: "1 tbsp olive oil" }
      ],
      steps: [
        { ar: "اخفق البيض مع الملح والفلفل.", en: "Beat eggs with salt and pepper." },
        { ar: "سخّن الزيت في مقلاة وأضف الخضار.", en: "Heat oil in a pan and add vegetables." },
        { ar: "صب خليط البيض فوق الخضار واطبخ حتى ينضج.", en: "Pour egg mixture over vegetables and cook until done." }
      ],
      calories: 250
    },
    breakfast2: {
      title: { ar: "الخبز الفرنسي مع الأفوكادو", en: "French Toast with Avocado" },
      ingredients: [
        { ar: "شريحتان خبز فرنسي", en: "2 slices French bread" },
        { ar: "نصف أفوكادو مهروس", en: "Half mashed avocado" },
        { ar: "بيضة", en: "1 egg" },
        { ar: "ملح وفلفل", en: "Salt and pepper" }
      ],
      steps: [
        { ar: "اخفق البيضة واغمس الخبز بها.", en: "Beat the egg and dip the bread." },
        { ar: "اقلي الخبز في مقلاة حتى يصبح ذهبي اللون.", en: "Fry the bread in a pan until golden." },
        { ar: "وزع الأفوكادو المهروس فوق الخبز وقدمه.", en: "Spread mashed avocado on the toast and serve." }
      ],
      calories: 300
    },
    lunch1: {
      title: { ar: "الدجاج المشوي مع الخضار", en: "Grilled Chicken with Vegetables" },
      ingredients: [
        { ar: "صدر دجاج", en: "Chicken breast" },
        { ar: "خضار مشوية", en: "Grilled vegetables" },
        { ar: "ملح وفلفل", en: "Salt and pepper" }
      ],
      steps: [
        { ar: "تبّل الدجاج بالملح والفلفل.", en: "Season chicken with salt and pepper." },
        { ar: "اشوِ الدجاج والخضار حتى ينضج.", en: "Grill chicken and vegetables until cooked." }
      ],
      calories: 400
    },
    lunch2: {
      title: { ar: "سلطة الكينوا", en: "Quinoa Salad" },
      ingredients: [
        { ar: "كوب كينوا مسلوقة", en: "1 cup cooked quinoa" },
        { ar: "خضار مقطعة", en: "Chopped vegetables" },
        { ar: "عصير ليمون", en: "Lemon juice" }
      ],
      steps: [
        { ar: "اخلط جميع المكونات.", en: "Mix all ingredients." },
        { ar: "قدم السلطة باردة.", en: "Serve the salad cold." }
      ],
      calories: 320
    },
    dinner1: {
      title: { ar: "سمك السلمون مع الليمون", en: "Salmon with Lemon" },
      ingredients: [
        { ar: "شريحة سمك سلمون", en: "Salmon fillet" },
        { ar: "عصير ليمون", en: "Lemon juice" },
        { ar: "ملح وفلفل", en: "Salt and pepper" }
      ],
      steps: [
        { ar: "تبّل السمك بالليمون والملح والفلفل.", en: "Season fish with lemon, salt, and pepper." },
        { ar: "اطبخ السمك في الفرن حتى ينضج.", en: "Cook fish in oven until done." }
      ],
      calories: 450
    },
    dinner2: {
      title: { ar: "السلطة اليونانية", en: "Greek Salad" },
      ingredients: [
        { ar: "خضار مشكلة", en: "Mixed vegetables" },
        { ar: "جبن فيتا", en: "Feta cheese" },
        { ar: "زيت زيتون", en: "Olive oil" }
      ],
      steps: [
        { ar: "اخلط جميع المكونات.", en: "Mix all ingredients." },
        { ar: "قدم السلطة باردة.", en: "Serve the salad cold." }
      ],
      calories: 280
    },
    snack1: {
      title: { ar: "كعك الشوفان بالعسل", en: "Oatmeal Honey Cookies" },
      ingredients: [
        { ar: "شوفان", en: "Oats" },
        { ar: "عسل", en: "Honey" },
        { ar: "زيت جوز الهند", en: "Coconut oil" }
      ],
      steps: [
        { ar: "اخلط المكونات.", en: "Mix ingredients." },
        { ar: "اخبز في الفرن حتى يصبح ذهبي اللون.", en: "Bake in oven until golden." }
      ],
      calories: 200
    },
    snack2: {
      title: { ar: "مكسرات مشكلة", en: "Mixed Nuts" },
      ingredients: [
        { ar: "لوز", en: "Almonds" },
        { ar: "كاجو", en: "Cashews" },
        { ar: "فستق", en: "Pistachios" }
      ],
      steps: [
        { ar: "امزج المكسرات.", en: "Mix nuts." },
        { ar: "قدمها كسناك.", en: "Serve as a snack." }
      ],
      calories: 250
    },
    dessert1: {
      title: { ar: "تشيز كيك الفراولة", en: "Strawberry Cheesecake" },
      ingredients: [
        { ar: "جبن كريمي", en: "Cream cheese" },
        { ar: "فراولة", en: "Strawberries" },
        { ar: "سكر", en: "Sugar" }
      ],
      steps: [
        { ar: "اخلط الجبن والسكر.", en: "Mix cheese and sugar." },
        { ar: "زين التشيز كيك بالفراولة.", en: "Decorate cheesecake with strawberries." }
      ],
      calories: 400
    },
    dessert2: {
      title: { ar: "بسكويت الشوكولاتة", en: "Chocolate Cookies" },
      ingredients: [
        { ar: "دقيق", en: "Flour" },
        { ar: "كاكاو", en: "Cocoa" },
        { ar: "سكر", en: "Sugar" }
      ],
      steps: [
        { ar: "اخلط المكونات.", en: "Mix ingredients." },
        { ar: "اخبز في الفرن حتى تنضج.", en: "Bake in oven until cooked." }
      ],
      calories: 350
    }
  };

  // دالة لجلب قيمة معلمة من الرابط
  function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
  }

  // الترجمة
  const translations = {
    ar: {
      recipe_details_title: "تفاصيل الوصفة",
      ingredients_title: "المكونات",
      steps_title: "طريقة التحضير",
      btn_back: "رجوع",
      menu_splash: "شاشة البداية",
      menu_login: "تسجيل الدخول",
      menu_register: "إنشاء حساب",
      menu_about: "حول التطبيق",
      menu_home: "الرئيسية",
      menu_profile: "الملف الشخصي",
      menu_categories: "التصنيفات",
      menu_all_recipes: "كل الوصفات",
      menu_calories: "تتبع السعرات الحرارية",
      menu_add_ingredient: "إضافة مكون",
      menu_category_recipes: "وصفات التصنيف",
      menu_recipe_details: "تفاصيل الوصفة",
      menu_search: "بحث",
      menu_shopping_list: "قائمة التسوق",
      menu_health_goals: "الأهداف الصحية",
      menu_settings: "الإعدادات"
    },
    en: {
      recipe_details_title: "Recipe Details",
      ingredients_title: "Ingredients",
      steps_title: "Preparation Steps",
      btn_back: "Back",
      menu_splash: "Splash Screen",
      menu_login: "Login",
      menu_register: "Register",
      menu_about: "About",
      menu_home: "Home",
      menu_profile: "Profile",
      menu_categories: "Categories",
      menu_all_recipes: "All Recipes",
      menu_calories: "Calorie Tracker",
      menu_add_ingredient: "Add Ingredient",
      menu_category_recipes: "Category Recipes",
      menu_recipe_details: "Recipe Details",
      menu_search: "Search",
      menu_shopping_list: "Shopping List",
      menu_health_goals: "Health Goals",
      menu_settings: "Settings"
    }
  };

  function translatePage(lang) {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (translations[lang] && translations[lang][key]) {
        el.textContent = translations[lang][key];
      }
    });

    if (lang === 'ar') {
      document.documentElement.lang = 'ar';
      document.documentElement.dir = 'rtl';
      document.getElementById('lang-ar').setAttribute('aria-pressed', 'true');
      document.getElementById('lang-en').setAttribute('aria-pressed', 'false');
    } else {
      document.documentElement.lang = 'en';
      document.documentElement.dir = 'ltr';
      document.getElementById('lang-ar').setAttribute('aria-pressed', 'false');
      document.getElementById('lang-en').setAttribute('aria-pressed', 'true');
    }
    updateContent(lang);
  }

  // عرض البيانات حسب اللغة
  function updateContent(lang) {
    const recipeId = getQueryParam('id');
    const recipe = recipes[recipeId];

    if (!recipe) {
      document.getElementById('recipe-title').textContent = lang === 'ar' ? 'الوصفة غير موجودة' : 'Recipe Not Found';
      document.getElementById('ingredients-list').innerHTML = '';
      document.getElementById('steps-list').innerHTML = '';
      document.getElementById('calories-info').textContent = '';
      return;
    }

    document.getElementById('recipe-title').textContent = recipe.title[lang];

    // المكونات
    const ingredientsList = document.getElementById('ingredients-list');
    ingredientsList.innerHTML = '';
    recipe.ingredients.forEach(item => {
      const li = document.createElement('li');
      li.textContent = item[lang];
      ingredientsList.appendChild(li);
    });

    // الخطوات
    const stepsList = document.getElementById('steps-list');
    stepsList.innerHTML = '';
    recipe.steps.forEach(step => {
      const li = document.createElement('li');
      li.textContent = step[lang];
      stepsList.appendChild(li);
    });

    // السعرات
    document.getElementById('calories-info').textContent = lang === 'ar' ? 
      `السعرات الحرارية: ${recipe.calories} سعر حراري` :
      `Calories: ${recipe.calories} kcal`;
  }

  document.getElementById('lang-ar').addEventListener('click', () => translatePage('ar'));
  document.getElementById('lang-en').addEventListener('click', () => translatePage('en'));

  document.addEventListener('DOMContentLoaded', () => translatePage('ar'));
</script>

</body>
</html>
