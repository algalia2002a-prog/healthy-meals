<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="all_recipes_title">كل الوصفات</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(140deg, #C8B6FF, #B9FBC0);
    margin: 0; padding: 0;
    min-height: 100vh;
    color: #333;
    overflow-x: hidden;
  }

  .container {
    max-width: 900px;
    background: rgba(255,255,255,0.95);
    border-radius: 22px;
    box-shadow: 0 0 25px rgba(0,0,0,0.15);
    margin: 80px auto 40px;
    padding: 30px 25px;
  }

  h1 {
    font-weight: 700;
    font-size: 2.2rem;
    margin-bottom: 30px;
    text-align: center;
    color: #5a3ea0;
  }

  h2 {
    font-weight: 600;
    font-size: 1.6rem;
    margin-top: 40px;
    margin-bottom: 20px;
    border-bottom: 3px solid #8A7FFF;
    padding-bottom: 8px;
  }

  .recipes-grid {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .recipe-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 0 15px rgba(0,0,0,0.1);
    width: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 15px;
    transition: transform 0.2s;
  }

  .recipe-card:hover {
    transform: scale(1.05);
  }

  .recipe-image {
    width: 100%;
    height: 150px;
    border-radius: 12px;
    background-color: #ddd;
    background-size: cover;
    background-position: center;
    margin-bottom: 12px;
  }

  .recipe-title {
    font-weight: 600;
    font-size: 1.2rem;
    margin-bottom: 12px;
    text-align: center;
    color: #4b338f;
  }

  .btn-details {
    background-color: #8A7FFF;
    color: white;
    border: none;
    padding: 10px 22px;
    border-radius: 22px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: background-color 0.3s;
  }

  .btn-details:hover {
    background-color: #6A5CF7;
  }

  /* زر القائمة */
  .sidebar-toggle {
    position: fixed;
    top: 16px;
    left: 16px;
    background-color: #8A7FFF;
    border: none;
    color: white;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    z-index: 1001;
  }

  .sidebar-toggle:hover {
    background-color: #6A5CF7;
  }

  /* القائمة الجانبية */
  .sidebar {
    height: 100%;
    width: 0;
    position: fixed;
    z-index: 1000;
    top: 0;
    left: 0;
    background-color: #7F67FF;
    overflow-x: hidden;
    transition: 0.3s;
    padding-top: 60px;
  }

  .sidebar a {
    padding: 15px 30px;
    text-decoration: none;
    font-size: 18px;
    color: white;
    display: block;
    transition: 0.2s;
  }

  .sidebar a:hover {
    background-color: #6A5CF7;
  }

  .sidebar .close-btn {
    position: absolute;
    top: 10px;
    right: 18px;
    font-size: 28px;
    color: white;
    cursor: pointer;
  }

  /* زر الترجمة */
  .lang-switcher {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 1002;
  }

  .lang-switcher button {
    background-color: #8A7FFF;
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    margin-left: 8px;
  }

  .lang-switcher button:hover {
    background-color: #6A5CF7;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .recipes-grid {
      flex-direction: column;
      align-items: center;
    }
    .recipe-card {
      width: 90%;
      max-width: 320px;
    }
  }
</style>
</head>
<body>

<!-- زر القائمة -->
<button class="sidebar-toggle" aria-label="فتح القائمة">&#9776;</button>

<!-- القائمة الجانبية -->
<div class="sidebar" id="sidebar" aria-label="القائمة الجانبية">
  <a href="javascript:void(0)" class="close-btn" aria-label="إغلاق القائمة">&times;</a>

  <a href="splash.html" data-i18n="menu_splash">الشاشة الرئيسية</a>
  <a href="login.html" data-i18n="menu_login">تسجيل الدخول</a>
  <a href="register.html" data-i18n="menu_register">التسجيل</a>
  <a href="about.html" data-i18n="menu_about">حول التطبيق</a>
  <a href="home.html" data-i18n="menu_home">الرئيسية</a>
  <a href="profile.html" data-i18n="menu_profile">الملف الشخصي</a>
  <a href="categories.html" data-i18n="menu_categories">التصنيفات</a>
  <a href="all-recipes.html" data-i18n="menu_all_recipes">جميع الوصفات</a>
  <a href="calorie-tracker.html" data-i18n="menu_calories">تتبع السعرات الحرارية</a>
  <a href="add-ingredient.html" data-i18n="menu_add_ingredient">إضافة مكون</a>
  <a href="category-recipes.html" data-i18n="menu_category_recipes">وصفات التصنيف</a>
  <a href="recipe-details.html" data-i18n="menu_recipe_details">تفاصيل الوصفة</a>
  <a href="search.html" data-i18n="menu_search">بحث</a>
  <a href="shopping-list.html" data-i18n="menu_shopping_list">قائمة التسوق</a>
  <a href="health-goals.html" data-i18n="menu_health_goals">الأهداف الصحية</a>
  <a href="settings.html" data-i18n="menu_settings">الإعدادات</a>
</div>

<!-- زر الترجمة -->
<div class="lang-switcher" id="lang-switcher" role="navigation" aria-label="تبديل اللغة">
  <button id="lang-ar" aria-pressed="true">العربية</button>
  <button id="lang-en" aria-pressed="false">English</button>
</div>

<div class="container" role="main" tabindex="0">
  <h1 data-i18n="all_recipes_title">كل الوصفات</h1>

  <!-- قسم لكل وجبة -->
  <section>
    <h2 data-i18n="breakfast">الفطور</h2>
    <div class="recipes-grid" id="breakfast-recipes"></div>
  </section>

  <section>
    <h2 data-i18n="lunch">الغداء</h2>
    <div class="recipes-grid" id="lunch-recipes"></div>
  </section>

  <section>
    <h2 data-i18n="dinner">العشاء</h2>
    <div class="recipes-grid" id="dinner-recipes"></div>
  </section>

  <section>
    <h2 data-i18n="snacks">وجبات خفيفة</h2>
    <div class="recipes-grid" id="snacks-recipes"></div>
  </section>

  <section>
    <h2 data-i18n="desserts">حلويات</h2>
    <div class="recipes-grid" id="desserts-recipes"></div>
  </section>
</div>

<script>
  // القائمة الجانبية
  const sidebar = document.getElementById('sidebar');
  const openBtn = document.querySelector('.sidebar-toggle');
  const closeBtn = sidebar.querySelector('.close-btn');

  openBtn.addEventListener('click', () => {
    sidebar.style.width = '250px';
  });

  closeBtn.addEventListener('click', () => {
    sidebar.style.width = '0';
  });

  window.addEventListener('click', (e) => {
    if (!sidebar.contains(e.target) && e.target !== openBtn) {
      sidebar.style.width = '0';
    }
  });

  // بيانات الوصفات مع الصور (تقدر تستبدل روابط الصور برابط الصور الحقيقي)
  const recipes = {
    breakfast: [
      {
        id: "breakfast1",
        title: { ar: "العجة بالخضار", en: "Vegetable Omelette" },
        image:"عجة.jpg"
      },
      {
        id: "breakfast2",
        title: { ar: "الخبز الفرنسي مع الأفوكادو", en: "French Toast with Avocado" },
        image: "افوكادو.JPG"
      }
    ],
    lunch: [
      {
        id: "lunch1",
        title: { ar: "الدجاج المشوي مع الخضار", en: "Grilled Chicken with Vegetables" },
        image:"دجاج.jpg"
      },
      {
        id: "lunch2",
        title: { ar: "سلطة الكينوا", en: "Quinoa Salad" },
        image: "كينوا.jpg"
      }
    ],
    dinner: [
      {
        id: "dinner1",
        title: { ar: "سمك السلمون مع الليمون", en: "Salmon with Lemon" },
        image: "سمك.jpg"
      },
      {
        id: "dinner2",
        title: { ar: "السلطة اليونانية", en: "Greek Salad" },
        image: "يونانية.jpg"
      }
    ],
    snacks: [
      {
        id: "snack1",
        title: { ar: "كعك الشوفان بالعسل", en: "Oatmeal Honey Cookies" },
        image: "شوفان.JPG"
      },
      {
        id: "snack2",
        title: { ar: "مكسرات مشكلة", en: "Mixed Nuts" },
        image: "مكسرات.JPG"
      }
    ],
    desserts: [
      {
        id: "dessert1",
        title: { ar: "تشيز كيك الفراولة", en: "Strawberry Cheesecake" },
        image: "تشيز.JPG"
      },
      {
        id: "dessert2",
        title: { ar: "بسكويت الشوكولاتة", en: "Chocolate Cookies" },
        image: "بسكويت.JPG"
      }
    ]
  };

  // الترجمة
  const translations = {
    ar: {
      all_recipes_title: "كل الوصفات",
      breakfast: "الفطور",
      lunch: "الغداء",
      dinner: "العشاء",
      snacks: "وجبات خفيفة",
      desserts: "حلويات",
      btn_details: "التفاصيل",
      menu_splash: "شاشة البداية",
      menu_login: "تسجيل الدخول",
      menu_register: "إنشاء حساب",
      menu_about: "حول التطبيق",
      menu_home: "الرئيسية",
      menu_profile: "الملف الشخصي",
      menu_categories: "التصنيفات",
      menu_all_recipes: "كل الوصفات",
      menu_calories: "تتبع السعرات الحرارية",
      menu_add_ingredient: "إضافة مكون",
      menu_category_recipes: "وصفات التصنيف",
      menu_recipe_details: "تفاصيل الوصفة",
      menu_search: "بحث",
      menu_shopping_list: "قائمة التسوق",
       menu_health_goals: "الأهداف الصحية",
      menu_settings: "الإعدادات"
    },
    en: {
      all_recipes_title: "All Recipes",
      breakfast: "Breakfast",
      lunch: "Lunch",
      dinner: "Dinner",
      snacks: "Snacks",
      desserts: "Desserts",
      btn_details: "Details",
      menu_splash: "Splash Screen",
      menu_login: "Login",
      menu_register: "Register",
      menu_about: "About",
      menu_home: "Home",
      menu_profile: "Profile",
      menu_categories: "Categories",
      menu_all_recipes: "All Recipes",
      menu_calories: "Calorie Tracker",
      menu_add_ingredient: "Add Ingredient",
      menu_category_recipes: "Category Recipes",
      menu_recipe_details: "Recipe Details",
      menu_search: "Search",
      menu_shopping_list: "Shopping List",
       menu_health_goals: "Health Goals",
      menu_settings: "Settings"
    }
  };

  function translatePage(lang) {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (translations[lang] && translations[lang][key]) {
        el.textContent = translations[lang][key];
      }
    });

    if (lang === 'ar') {
      document.documentElement.lang = 'ar';
      document.documentElement.dir = 'rtl';
      document.getElementById('lang-ar').setAttribute('aria-pressed', 'true');
      document.getElementById('lang-en').setAttribute('aria-pressed', 'false');
    } else {
      document.documentElement.lang = 'en';
      document.documentElement.dir = 'ltr';
      document.getElementById('lang-ar').setAttribute('aria-pressed', 'false');
      document.getElementById('lang-en').setAttribute('aria-pressed', 'true');
    }

    renderRecipes(lang);
  }

  // عرض الوصفات في الصفحة
  function renderRecipes(lang) {
    ['breakfast', 'lunch', 'dinner', 'snacks', 'desserts'].forEach(category => {
      const container = document.getElementById(`${category}-recipes`);
      container.innerHTML = '';

      recipes[category].forEach(recipe => {
        const card = document.createElement('div');
        card.className = 'recipe-card';

        const img = document.createElement('div');
        img.className = 'recipe-image';
        img.style.backgroundImage = `url(${recipe.image})`;
        img.setAttribute('alt', recipe.title[lang]);

        const title = document.createElement('div');
        title.className = 'recipe-title';
        title.textContent = recipe.title[lang];

        const btn = document.createElement('a');
        btn.className = 'btn-details';
        btn.href = `recipe-details.html?id=${recipe.id}`;
        btn.setAttribute('aria-label', lang === 'ar' ? `عرض تفاصيل ${recipe.title[lang]}` : `View details of ${recipe.title[lang]}`);
        btn.textContent = translations[lang].btn_details;

        card.appendChild(img);
        card.appendChild(title);
        card.appendChild(btn);

        container.appendChild(card);
      });
    });
  }

  document.getElementById('lang-ar').addEventListener('click', () => translatePage('ar'));
  document.getElementById('lang-en').addEventListener('click', () => translatePage('en'));

  document.addEventListener('DOMContentLoaded', () => translatePage('ar'));

</script>

</body>
</html>
