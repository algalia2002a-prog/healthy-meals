<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="profile_title">الملف الشخصي</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(140deg, #C8B6FF, #B9FBC0);
    margin: 0; padding: 0;
    min-height: 100vh;
    color: #333;
    overflow-x: hidden;
  }

  .container {
    max-width: 450px;
    background: rgba(255,255,255,0.95);
    border-radius: 22px;
    box-shadow: 0 0 25px rgba(0,0,0,0.15);
    margin: 80px auto 40px;
    padding: 30px 25px;
    text-align: right;
  }

  h1 {
    font-weight: 700;
    font-size: 2rem;
    margin-bottom: 25px;
    text-align: center;
  }

  label {
    display: block;
    font-weight: 600;
    margin: 15px 0 6px 0;
  }

  input[type="text"],
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 10px 14px;
    font-size: 1rem;
    border: 2px solid #8A7FFF;
    border-radius: 12px;
    outline: none;
    transition: 0.3s;
    direction: ltr;
    background-color: #f5f5f5;
  }

  input[type="text"]:focus,
  input[type="email"]:focus,
  input[type="password"]:focus {
    border-color: #6A5CF7;
    background-color: white;
  }

  input[disabled] {
    background-color: #e0e0e0;
    color: #777;
    cursor: not-allowed;
  }

  .btn {
    background-color: #8A7FFF;
    color: white;
    border: none;
    padding: 14px 0;
    border-radius: 25px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.3s;
    width: 48%;
    margin-top: 25px;
  }

  .btn:hover {
    background-color: #6A5CF7;
  }

  .btn-container {
    display: flex;
    justify-content: space-between;
  }

  /* زر فتح القائمة */
  .sidebar-toggle {
    position: fixed;
    top: 16px;
    left: 16px;
    background-color: #8A7FFF;
    border: none;
    color: white;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    z-index: 1001;
  }

  .sidebar-toggle:hover {
    background-color: #6A5CF7;
  }

  /* القائمة الجانبية */
  .sidebar {
    height: 100%;
    width: 0;
    position: fixed;
    z-index: 1000;
    top: 0;
    left: 0;
    background-color: #7F67FF;
    overflow-x: hidden;
    transition: 0.3s;
    padding-top: 60px;
  }

  .sidebar a {
    padding: 15px 30px;
    text-decoration: none;
    font-size: 18px;
    color: white;
    display: block;
    transition: 0.2s;
  }

  .sidebar a:hover {
    background-color: #6A5CF7;
  }

  .sidebar .close-btn {
    position: absolute;
    top: 10px;
    right: 18px;
    font-size: 28px;
    color: white;
    cursor: pointer;
  }

  /* زر الترجمة */
  .lang-switcher {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 1002;
  }

  .lang-switcher button {
    background-color: #8A7FFF;
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    margin-left: 8px;
  }

  .lang-switcher button:hover {
    background-color: #6A5CF7;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .container {
      margin: 60px 12px 30px;
      padding: 20px 15px;
    }
    h1 {
      font-size: 1.7rem;
    }
    .btn-container {
      flex-direction: column;
      gap: 15px;
    }
    .btn {
      width: 100%;
    }
  }
</style>
</head>
<body>

<!-- زر القائمة -->
<button class="sidebar-toggle" aria-label="فتح القائمة">&#9776;</button>

<!-- القائمة الجانبية -->
<div class="sidebar" id="sidebar" aria-label="القائمة الجانبية">
  <a href="javascript:void(0)" class="close-btn" aria-label="إغلاق القائمة">&times;</a>

  <a href="splash.html" data-i18n="menu_splash">شاشة البداية</a>
  <a href="login.html" data-i18n="menu_login">تسجيل الدخول</a>
  <a href="register.html" data-i18n="menu_register">إنشاء حساب</a>
  <a href="about.html" data-i18n="menu_about">حول التطبيق</a>
  <a href="home.html" data-i18n="menu_home">الرئيسية</a>
  <a href="profile.html" data-i18n="menu_profile">الملف الشخصي</a>
  <a href="categories.html" data-i18n="menu_categories">التصنيفات</a>
  <a href="all-recipes.html" data-i18n="menu_all_recipes">كل الوصفات</a>
  <a href="calorie-tracker.html" data-i18n="menu_calories">تتبع السعرات الحرارية</a>
  <a href="add-ingredient.html" data-i18n="menu_add_ingredient">إضافة مكون</a>
  <a href="category-recipes.html" data-i18n="menu_category_recipes">وصفات التصنيف</a>
  <a href="recipe-details.html" data-i18n="menu_recipe_details">تفاصيل الوصفة</a>
  <a href="search.html" data-i18n="menu_search">بحث</a>
  <a href="shopping-list.html" data-i18n="menu_shopping_list">قائمة التسوق</a>
  <a href="health-goals.html" data-i18n="menu_health_goals">الأهداف الصحية</a>
  <a href="settings.html" data-i18n="menu_settings">الإعدادات</a>
</div>

<!-- زر الترجمة -->
<div class="lang-switcher" id="lang-switcher" role="navigation" aria-label="تبديل اللغة">
  <button id="lang-ar" aria-pressed="true">العربية</button>
  <button id="lang-en" aria-pressed="false">English</button>
</div>

<!-- محتوى الصفحة -->
<div class="container">
  <h1 data-i18n="profile_title">الملف الشخصي</h1>
  <form id="profile-form" novalidate>
    <label for="name" data-i18n="label_name">الاسم الكامل</label>
    <input type="text" id="name" name="name" disabled placeholder="" data-i18n-placeholder="ph_name" />

    <label for="email" data-i18n="label_email">البريد الإلكتروني</label>
    <input type="email" id="email" name="email" disabled placeholder="" data-i18n-placeholder="ph_email" />

    <label for="password" data-i18n="label_password">كلمة المرور</label>
    <input type="password" id="password" name="password" disabled placeholder="" data-i18n-placeholder="ph_password" />

    <div class="btn-container">
      <button type="button" class="btn" id="edit-btn" data-i18n="btn_edit">تعديل البيانات</button>
      <button type="submit" class="btn" id="save-btn" data-i18n="btn_save" disabled>حفظ</button>
    </div>
  </form>
</div>

<script>
  // القائمة الجانبية
  const sidebar = document.getElementById('sidebar');
  const openBtn = document.querySelector('.sidebar-toggle');
  const closeBtn = sidebar.querySelector('.close-btn');

  openBtn.addEventListener('click', () => {
    sidebar.style.width = '250px';
  });

  closeBtn.addEventListener('click', () => {
    sidebar.style.width = '0';
  });

  window.addEventListener('click', (e) => {
    if (!sidebar.contains(e.target) && e.target !== openBtn) {
      sidebar.style.width = '0';
    }
  });

  // ترجمة الصفحة
  const translations = {
    ar: {
      profile_title: "الملف الشخصي",
      label_name: "الاسم الكامل",
      label_email: "البريد الإلكتروني",
      label_password: "كلمة المرور",
      btn_edit: "تعديل البيانات",
      btn_save: "حفظ",
      ph_name: "أدخل اسمك الكامل",
      ph_email: "example@mail.com",
      ph_password: "********",
      menu_splash: "شاشة البداية",
      menu_login: "تسجيل الدخول",
      menu_register: "إنشاء حساب",
      menu_about: "حول التطبيق",
      menu_home: "الرئيسية",
      menu_profile: "الملف الشخصي",
      menu_categories: "التصنيفات",
      menu_all_recipes: "كل الوصفات",
      menu_calories: "تتبع السعرات الحرارية",
      menu_add_ingredient: "إضافة مكون",
      menu_category_recipes: "وصفات التصنيف",
      menu_recipe_details: "تفاصيل الوصفة",
      menu_search: "بحث",
      menu_shopping_list: "قائمة التسوق",
      menu_health_goals: "الأهداف الصحية",
      menu_settings: "الإعدادات"
    },
    en: {
      profile_title: "Profile",
      label_name: "Full Name",
      label_email: "Email Address",
      label_password: "Password",
      btn_edit: "Edit Data",
      btn_save: "Save",
      ph_name: "Enter your full name",
      ph_email: "example@mail.com",
      ph_password: "********",
      menu_splash: "Splash Screen",
      menu_login: "Login",
      menu_register: "Register",
      menu_about: "About",
      menu_home: "Home",
      menu_profile: "Profile",
      menu_categories: "Categories",
      menu_all_recipes: "All Recipes",
      menu_calories: "Calorie Tracker",
      menu_add_ingredient: "Add Ingredient",
      menu_category_recipes: "Category Recipes",
      menu_recipe_details: "Recipe Details",
      menu_search: "Search",
      menu_shopping_list: "Shopping List",
      menu_health_goals: "Health Goals",
      menu_settings: "Settings"
    }
  };

  function translatePage(lang) {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (translations[lang] && translations[lang][key]) {
        el.textContent = translations[lang][key];
      }
    });

    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder');
      if (translations[lang] && translations[lang][key]) {
        el.placeholder = translations[lang][key];
      }
    });

    if (lang === 'ar') {
      document.documentElement.lang = 'ar';
      document.documentElement.dir = 'rtl';
      document.getElementById('lang-ar').setAttribute('aria-pressed', 'true');
      document.getElementById('lang-en').setAttribute('aria-pressed', 'false');
    } else {
      document.documentElement.lang = 'en';
      document.documentElement.dir = 'ltr';
      document.getElementById('lang-ar').setAttribute('aria-pressed', 'false');
      document.getElementById('lang-en').setAttribute('aria-pressed', 'true');
    }
  }

  document.getElementById('lang-ar').addEventListener('click', () => translatePage('ar'));
  document.getElementById('lang-en').addEventListener('click', () => translatePage('en'));

  document.addEventListener('DOMContentLoaded', () => translatePage('ar'));

  // تفعيل تعديل الحقول
  const editBtn = document.getElementById('edit-btn');
  const saveBtn = document.getElementById('save-btn');
  const inputs = document.querySelectorAll('#profile-form input');

  editBtn.addEventListener('click', () => {
    inputs.forEach(input => {
      input.disabled = false;
      input.style.backgroundColor = 'white';
      input.focus();
    });
    saveBtn.disabled = false;
    editBtn.disabled = true;
  });

  // حفظ البيانات (هنا مجرد مثال بدون حفظ فعلي)
  document.getElementById('profile-form').addEventListener('submit', (e) => {
    e.preventDefault();
    inputs.forEach(input => {
      input.disabled = true;
      input.style.backgroundColor = '#e0e0e0';
    });
    saveBtn.disabled = true;
    editBtn.disabled = false;
    alert('تم حفظ البيانات بنجاح!');
  });
</script>

</body>
</html>
