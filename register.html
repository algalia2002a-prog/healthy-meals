<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="register_title">إنشاء حساب</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(140deg, #C8B6FF, #B9FBC0);
    margin: 0; padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #333;
    text-align: center;
    overflow-x: hidden;
  }

  .register-container {
    max-width: 400px;
    width: 90%;
    background: rgba(255,255,255,0.9);
    border-radius: 22px;
    box-shadow: 0 0 25px rgba(0,0,0,0.15);
    padding: 30px 25px;
  }

  h1 {
    font-weight: 700;
    font-size: 2rem;
    margin-bottom: 25px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  label {
    text-align: right;
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 1rem;
  }

  input[type="text"],
  input[type="email"],
  input[type="password"] {
    padding: 12px 14px;
    font-size: 1rem;
    border: 2px solid #8A7FFF;
    border-radius: 12px;
    outline: none;
    transition: 0.3s;
    direction: ltr;
  }

  input[type="text"]:focus,
  input[type="email"]:focus,
  input[type="password"]:focus {
    border-color: #6A5CF7;
  }

  .password-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .password-wrapper input {
    flex: 1;
  }

  .toggle-password {
    position: absolute;
    right: 12px;
    cursor: pointer;
    font-size: 1.2rem;
    user-select: none;
    color: #6A5CF7;
    background: none;
    border: none;
  }

  .btn-register {
    background-color: #8A7FFF;
    color: white;
    border: none;
    padding: 14px 0;
    border-radius: 25px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.3s;
  }

  .btn-register:hover {
    background-color: #6A5CF7;
  }

  /* رابط تسجيل الدخول */
  .login-link {
    margin-top: 15px;
    font-size: 1rem;
  }
  .login-link a {
    color: #6A5CF7;
    text-decoration: none;
    font-weight: 600;
  }
  .login-link a:hover {
    text-decoration: underline;
  }

  /* زر فتح القائمة */
  .sidebar-toggle {
    position: fixed;
    top: 16px;
    left: 16px;
    background-color: #8A7FFF;
    border: none;
    color: white;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    z-index: 1001;
  }

  .sidebar-toggle:hover {
    background-color: #6A5CF7;
  }

  /* القائمة الجانبية */
  .sidebar {
    height: 100%;
    width: 0;
    position: fixed;
    z-index: 1000;
    top: 0;
    left: 0;
    background-color: #7F67FF;
    overflow-x: hidden;
    transition: 0.3s;
    padding-top: 60px;
  }

  .sidebar a {
    padding: 15px 30px;
    text-decoration: none;
    font-size: 18px;
    color: white;
    display: block;
    transition: 0.2s;
  }

  .sidebar a:hover {
    background-color: #6A5CF7;
  }

  .sidebar .close-btn {
    position: absolute;
    top: 10px;
    right: 18px;
    font-size: 28px;
    color: white;
    cursor: pointer;
  }

  /* زر الترجمة */
  .lang-switcher {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 1002;
  }

  .lang-switcher button {
    background-color: #8A7FFF;
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    margin-left: 8px;
  }

  .lang-switcher button:hover {
    background-color: #6A5CF7;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .register-container {
      width: 95%;
      padding: 25px 18px;
    }
    h1 {
      font-size: 1.7rem;
    }
  }

</style>
</head>
<body>

<!-- زر القائمة -->
<button class="sidebar-toggle" aria-label="فتح القائمة">&#9776;</button>

<!-- القائمة الجانبية -->
<div class="sidebar" id="sidebar" aria-label="القائمة الجانبية">
  <a href="javascript:void(0)" class="close-btn" aria-label="إغلاق القائمة">&times;</a>

  <a href="splash.html" data-i18n="menu_splash">شاشة البداية</a>
  <a href="login.html" data-i18n="menu_login">تسجيل الدخول</a>
  <a href="register.html" data-i18n="menu_register">إنشاء حساب</a>
  <a href="about.html" data-i18n="menu_about">حول التطبيق</a>
  <a href="home.html" data-i18n="menu_home">الرئيسية</a>
  <a href="profile.html" data-i18n="menu_profile">الملف الشخصي</a>
  <a href="categories.html" data-i18n="menu_categories">التصنيفات</a>
  <a href="all-recipes.html" data-i18n="menu_all_recipes">كل الوصفات</a>
  <a href="calorie-tracker.html" data-i18n="menu_calories">تتبع السعرات الحرارية</a>
  <a href="add-ingredient.html" data-i18n="menu_add_ingredient">إضافة مكون</a>
  <a href="category-recipes.html" data-i18n="menu_category_recipes">وصفات التصنيف</a>
  <a href="recipe-details.html" data-i18n="menu_recipe_details">تفاصيل الوصفة</a>
  <a href="search.html" data-i18n="menu_search">بحث</a>
  <a href="shopping-list.html" data-i18n="menu_shopping_list">قائمة التسوق</a>
  <a href="health-goals.html" data-i18n="menu_health_goals">الأهداف الصحية</a>
  <a href="settings.html" data-i18n="menu_settings">الإعدادات</a>
</div>

<!-- زر الترجمة -->
<div class="lang-switcher" id="lang-switcher" role="navigation" aria-label="تبديل اللغة">
  <button id="lang-ar" aria-pressed="true">العربية</button>
  <button id="lang-en" aria-pressed="false">English</button>
</div>

<!-- صندوق التسجيل -->
<div class="register-container">
  <h1 data-i18n="register_title">إنشاء حساب</h1>
  <form id="register-form" autocomplete="off" novalidate>
    <div>
      <label for="name" data-i18n="label_name">الاسم الكامل</label>
      <input type="text" id="name" name="name" placeholder="" data-i18n-placeholder="ph_name" required />
    </div>

    <div>
      <label for="email" data-i18n="label_email">البريد الإلكتروني</label>
      <input type="email" id="email" name="email" placeholder="" data-i18n-placeholder="ph_email" required />
    </div>

    <div>
      <label for="password" data-i18n="label_password">كلمة المرور</label>
      <div class="password-wrapper">
        <input type="password" id="password" name="password" placeholder="" data-i18n-placeholder="ph_password" required />
        <button type="button" class="toggle-password" aria-label="إظهار أو إخفاء كلمة المرور">عرض</button>
      </div>
    </div>

    <button type="submit" class="btn-register" data-i18n="btn_register">تسجيل</button>
  </form>

  <p class="login-link">
    <span data-i18n="have_account">هل لديك حساب؟</span>
    <a href="login.html" data-i18n="login_here">سجل الدخول هنا</a>
  </p>
</div>

<script>
  // القائمة الجانبية
  const sidebar = document.getElementById('sidebar');
  const openBtn = document.querySelector('.sidebar-toggle');
  const closeBtn = sidebar.querySelector('.close-btn');

  openBtn.addEventListener('click', () => {
    sidebar.style.width = '250px';
  });

  closeBtn.addEventListener('click', () => {
    sidebar.style.width = '0';
  });

  window.addEventListener('click', (e) => {
    if (!sidebar.contains(e.target) && e.target !== openBtn) {
      sidebar.style.width = '0';
    }
  });

  // إظهار وإخفاء كلمة المرور
  const togglePasswordBtn = document.querySelector('.toggle-password');
  const passwordInput = document.getElementById('password');

  togglePasswordBtn.addEventListener('click', () => {
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      togglePasswordBtn.textContent = 'إخفاء';
      togglePasswordBtn.setAttribute('aria-pressed', 'true');
    } else {
      passwordInput.type = 'password';
      togglePasswordBtn.textContent = 'عرض';
      togglePasswordBtn.setAttribute('aria-pressed', 'false');
    }
  });

  // ترجمة الصفحة
  const translations = {
    ar: {
      register_title: "إنشاء حساب",
      label_name: "الاسم الكامل",
      label_email: "البريد الإلكتروني",
      label_password: "كلمة المرور",
      btn_register: "تسجيل",
      ph_name: "أدخل اسمك الكامل",
      ph_email: "example@mail.com",
      ph_password: "********",
      have_account: "هل لديك حساب؟",
      login_here: "سجل الدخول هنا",
      menu_splash: "شاشة البداية",
      menu_login: "تسجيل الدخول",
      menu_register: "إنشاء حساب",
      menu_about: "حول التطبيق",
      menu_home: "الرئيسية",
      menu_profile: "الملف الشخصي",
      menu_categories: "التصنيفات",
      menu_all_recipes: "كل الوصفات",
      menu_calories: "تتبع السعرات الحرارية",
      menu_add_ingredient: "إضافة مكون",
      menu_category_recipes: "وصفات التصنيف",
      menu_recipe_details: "تفاصيل الوصفة",
      menu_search: "بحث",
      menu_shopping_list: "قائمة التسوق",
      menu_health_goals: "الأهداف الصحية",
      menu_settings: "الإعدادات"
    },
    en: {
      register_title: "Register",
      label_name: "Full Name",
      label_email: "Email Address",
      label_password: "Password",
      btn_register: "Sign Up",
      ph_name: "Enter your full name",
      ph_email: "example@mail.com",
      ph_password: "********",
      have_account: "Already have an account?",
      login_here: "Login here",
      menu_splash: "Splash Screen",
      menu_login: "Login",
      menu_register: "Register",
      menu_about: "About",
      menu_home: "Home",
      menu_profile: "Profile",
      menu_categories: "Categories",
      menu_all_recipes: "All Recipes",
      menu_calories: "Calorie Tracker",
      menu_add_ingredient: "Add Ingredient",
      menu_category_recipes: "Category Recipes",
      menu_recipe_details: "Recipe Details",
      menu_search: "Search",
      menu_shopping_list: "Shopping List",
      menu_health_goals: "Health Goals",
      menu_settings: "Settings"
    }
  };

  function translatePage(lang) {
    // نصوص الصفحة
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (translations[lang] && translations[lang][key]) {
        el.textContent = translations[lang][key];
      }
    });
    // الـ placeholders
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder');
      if (translations[lang] && translations[lang][key]) {
        el.placeholder = translations[lang][key];
      }
    });
    // تحديث اتجاه الصفحة ولغة الـ html
    if (lang === 'ar') {
      document.documentElement.lang = 'ar';
      document.documentElement.dir = 'rtl';
      // تحديث aria-pressed للأزرار
      document.getElementById('lang-ar').setAttribute('aria-pressed', 'true');
      document.getElementById('lang-en').setAttribute('aria-pressed', 'false');
    } else {
      document.documentElement.lang = 'en';
      document.documentElement.dir = 'ltr';
      document.getElementById('lang-ar').setAttribute('aria-pressed', 'false');
      document.getElementById('lang-en').setAttribute('aria-pressed', 'true');
    }
  }

  // أزرار تغيير اللغة
  document.getElementById('lang-ar').addEventListener('click', () => {
    translatePage('ar');
  });
  document.getElementById('lang-en').addEventListener('click', () => {
    translatePage('en');
  });

  // بدء الصفحة بالعربية بشكل افتراضي
  document.addEventListener('DOMContentLoaded', () => {
    translatePage('ar');
  });

  // عند الضغط على زر التسجيل، توجه لصفحة تسجيل الدخول
  document.getElementById('register-form').addEventListener('submit', function(event) {
    event.preventDefault(); // منع الإرسال الفعلي للنموذج
    // هنا ممكن تضيف تحقق أو معالجة قبل التوجيه إذا احتجت
    window.location.href = 'login.html';
  });
</script>

</body>
</html>
